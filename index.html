 const hist=(c.configHistory||[]).slice(0,10).map(h=>`<div class="security-row"><div><b>${escv(h.reason)}</b><div class="small muted">${new Date(h.date).toLocaleString('en-IN')} · ${escv(h.adminId)}</div></div><button class="btn" onclick="adminRollbackConfig('${escv(h.version)}')">Rollback</button></div>`).join('')||'<div class="admin-empty">No configuration history yet.</div>';
 return adminLayout('control','Platform Control Center',`<div class="admin-kpis"><div class="admin-kpi"><span>Config Version</span><b>${escv(c.version)}</b></div><div class="admin-kpi"><span>Feature Flags</span><b>${Object.values(c.features).filter(Boolean).length}/${Object.keys(c.features).length}</b></div><div class="admin-kpi"><span>Plans</span><b>${c.plans.length}</b></div><div class="admin-kpi"><span>Ad Packages</span><b>${c.ads.packages.length}</b></div></div>
 <div class="admin-card"><div class="section-head"><div><h2>Commission Control</h2><div class="sub">Future transactions only. Historical order snapshots stay unchanged.</div></div></div><div class="form-grid">${input('Default %','acDef',co.defaultPct,'number')}${input('New Seller %','acNew',co.newSellerPct,'number')}${input('Premium %','acPrem',co.premiumPct,'number')}${input('Promotional %','acPromo',co.promotionalPct,'number')}${input('Temporary %','acTemp',co.temporaryPct,'number')}${input('Fixed Commission','acFixed',co.fixed,'number')}${input('Minimum %','acMin',co.min,'number')}${input('Maximum %','acMax',co.max,'number')}</div><button class="btn primary" onclick="adminControlSave('commission')">Save Commission</button></div>
 <div class="admin-card"><div class="section-head"><div><h2>Subscription Plans</h2><div class="sub">CRUD-style plan controls stored in configuration.</div></div><button class="btn primary" onclick="adminPlanCreate()">+ Create Plan</button></div>${plans}</div>
 <div class="admin-card"><div class="section-head"><div><h2>Feature Control Center</h2><div class="sub">Toggle major features without editing source code.</div></div></div>${featureRows}</div>
 <div class="admin-card"><div class="section-head"><div><h2>Marketplace Rules</h2><div class="sub">Limits are applied to future actions where the prototype supports them.</div></div></div><div class="form-grid">${input('Minimum Product Price','acMinPrice',r.minProductPrice,'number')}${input('Maximum Product Price','acMaxPrice',r.maxProductPrice,'number')}${input('Product Upload Limit','acUploadLimit',r.productUploadLimit,'number')}${input('Max File Size MB','acFileSize',r.maxFileSizeMB,'number')}${input('Allowed File Types','acFileTypes',r.allowedFileTypes)}${input('Min Withdrawal','acMinWithdrawal',r.minWithdrawal,'number')}${input('Max Withdrawal','acMaxWithdrawal',r.maxWithdrawal,'number')}${input('Refund Window Days','acRefundWindow',r.refundWindowDays,'number')}${input('Order Cancel Hours','acCancelWindow',r.orderCancellationWindowHours,'number')}</div><div class="ac-checks">${check('Seller Verification Required','acSellerVerify',r.sellerVerificationRequired)}${check('Automatic Product Approval','acAutoApproval',r.automaticApproval)}${check('Manual Approval','acManualApproval',r.manualApproval)}</div><button class="btn primary" onclick="adminControlSave('rules')">Save Rules</button></div>
 <div class="admin-card"><h2>Payment Control</h2><div class="sub">Prototype only. Secrets never belong here.</div><div class="form-grid">${select('Gateway Status','acGatewayStatus',p.gatewayStatus,['TEST','DISABLED','MAINTENANCE'])}${select('Mode','acPayMode',p.mode,['TEST','LIVE'])}${select('Currency','acCurrency',p.currency,['INR','USD'])}${input('Timeout Minutes','acPayTimeout',p.timeoutMinutes,'number')}${input('Minimum Payment','acPayMin',p.minPayment,'number')}${input('Maximum Payment','acPayMax',p.maxPayment,'number')}</div><div class="ac-checks">${check('Automatic Verification','acAutoVerify',p.autoVerify)}${check('Manual Verification','acManualVerify',p.manualVerify)}</div><button class="btn danger" onclick="adminControlSave('payment')">Save Payment Control</button></div>
 <div class="admin-card"><h2>Payout / Withdrawal Control</h2><div class="form-grid">${input('Minimum','acPMin',po.min,'number')}${input('Maximum','acPMax',po.max,'number')}${input('Processing Fee %','acPPct',po.processingFeePct,'number')}${input('Fixed Fee','acPFixed',po.fixedFee,'number')}${select('Schedule','acPSchedule',po.schedule,['MANUAL','INSTANT','DAILY','WEEKLY'])}</div><div class="ac-checks">${check('Instant Payout','acInstant',po.instant)}${check('Daily','acDaily',po.daily)}${check('Weekly','acWeekly',po.weekly)}${check('Manual','acManual',po.manual)}${check('Verification Required','acPVerify',po.verificationRequired)}</div><button class="btn danger" onclick="adminControlSave('payout')">Save Payout Control</button></div>
 <div class="admin-card"><h2>Advertising Packages</h2>${ads}</div>
 <div class="admin-card"><h2>Referral Control</h2><div class="form-grid">${input('Buyer Reward','acBuyerReward',ref.buyerReward,'number')}${input('Seller Reward','acSellerReward',ref.sellerReward,'number')}${input('Referral Commission %','acRefPct',ref.commissionPct,'number')}${input('Max Monthly Reward','acRefMax',ref.maxMonthlyReward,'number')}${input('Expiration Days','acRefExp',ref.expirationDays,'number')}${select('Eligibility','acRefEligibility',ref.eligibility,['ALL','VERIFIED','SELLERS','BUYERS'])}</div><div class="ac-checks">${check('Referral System Enabled','acRefEnabled',ref.enabled)}</div><button class="btn primary" onclick="adminControlSave('referral')">Save Referral Control</button></div>
 <div class="admin-card"><h2>Seller-Specific Override</h2><div class="form-grid">${input('Seller ID','acSellerId','')}${input('Commission %','acSellerCommission',5,'number')}${select('Subscription','acSellerPlan','FREE',c.plans.map(x=>x.id))}${input('Product Limit','acSellerLimit','GLOBAL')}</div><div class="ac-checks">${check('Ads Enabled','acSellerAds',true)}${check('Withdrawal Enabled','acSellerWithdrawal',true)}${check('Featured Seller','acSellerFeatured',false)}${check('Analytics Enabled','acSellerAnalytics',true)}</div><button class="btn primary" onclick="adminSellerOverrideSave()">Save Seller Override</button></div>
 <div class="admin-card"><h2>Category Commission</h2><div class="form-grid">${input('Category Name','acCatName','')}${input('Commission %','acCatCommission',10,'number')}</div><button class="btn primary" onclick="adminCategoryCommissionSave()">Save Category Commission</button>${Object.entries(co.categoryOverrides||{}).map(([k,v])=>`<div class="security-row"><span>${escv(k)}</span><b>${escv(v)}%</b></div>`).join('')}</div>
 <div class="admin-card"><h2>Homepage Section Manager</h2><div class="sub">Enable/disable and reorder sections.</div>${sections}</div>
 <div class="admin-card"><h2>Website CMS / Branding</h2><div class="form-grid">${input('Website Name','acBrandName',b.websiteName)}${input('Primary Color','acPrimary',b.primaryColor)}${input('Secondary Color','acSecondary',b.secondaryColor)}${input('Font','acFont',b.font)}${input('Footer Copyright','acFooterCopy',b.footerCopyright)}${input('Contact Email','acContactEmail',b.contactEmail)}${input('Contact Info','acContactInfo',b.contactInfo)}${input('Email Sender Name','acSenderName',b.emailSenderName)}${input('Hero Title','acHeroTitle',cm.heroTitle)}${input('Hero Subtitle','acHeroSubtitle',cm.heroSubtitle)}${input('Hero Image URL','acHeroImage',cm.heroImage)}${input('CTA Text','acCta',cm.ctaText)}${input('CMS Footer','acCmsFooter',cm.footer)}</div><button class="btn primary" onclick="adminControlSave('branding');adminControlSave('cms')">Save Website Controls</button></div>
 <div class="admin-card"><h2>Global Announcement</h2><div class="form-grid">${input('Title','acAnnTitle',a.title)}${input('Start Date','acAnnStart',a.startDate,'date')}${input('End Date','acAnnEnd',a.endDate,'date')}${select('Audience','acAnnAudience',a.audience,['Everyone','Buyers','Sellers','Premium Sellers','Specific Users'])}</div><div class="field"><label>Message</label><textarea id="acAnnMessage">${escv(a.message)}</textarea></div><div class="ac-checks">${check('Announcement Active','acAnnEnabled',a.enabled)}</div><button class="btn primary" onclick="adminControlSave('announcement')">Save Announcement</button></div>
 <div class="admin-card"><div class="section-head"><div><h2>Configuration History / Rollback</h2><div class="sub">Important changes keep snapshots for rollback.</div></div></div>${hist}</div>
 <div class="admin-card"><h2>Exports</h2><div class="admin-actions">${['users','sellers','products','orders','payouts','ads'].map(k=>`<button class="btn" onclick="adminExportData('${k}')">Export ${k.toUpperCase()} CSV</button>`).join('')}<button class="btn" onclick="window.print()">Print / Save PDF</button></div></div>
 <div class="admin-card"><h2>Security Architecture</h2><p class="muted">Frontend controls are not the final authorization boundary. Production must enforce role permissions, RLS, payment verification, idempotency, rate limits and secret isolation on the server.</p></div>`)};
 // Make existing seller fee calculation consult configured category/seller overrides for future orders only.
 const originalEffective=window.effectivePlatformFeeRate;
 window.effectivePlatformFeeRate=function(sid,when){const c=pc(),ss=S.sellers?.[sid];if(ss?.manualCommissionPct!=null&&!isNaN(Number(ss.manualCommissionPct)))return Math.min(1,Math.max(0,Number(ss.manualCommissionPct)/100));const catProduct=(S.products||[]).find(x=>x.sellerId===sid);if(catProduct&&c.commission.categoryOverrides?.[catProduct.category]!=null)return Math.min(1,Math.max(0,Number(c.commission.categoryOverrides[catProduct.category])/100));return originalEffective?originalEffective(sid,when):Number(c.commission.defaultPct||20)/100};
 // Apply configurable withdrawal limits to existing payout request function via a wrapper only where source exposes the original function.
 const originalRequestPayout=window.requestPayout;
 if(originalRequestPayout)window.requestPayout=function(){if(!systemGuard('withdrawals','Withdrawals are temporarily disabled by Admin'))return;const s=currentSeller();if(!s)return;const amount=Number(document.getElementById('payoutAmount')?.value||0);const c=pc().payout,rr=pc().rules||{};const effectiveMin=Math.max(Number(c.min||0),Number(rr.minWithdrawal||0));const effectiveMax=Math.min(Number(c.max||1e15),Number(rr.maxWithdrawal||1e15));if(amount<effectiveMin){toast('Minimum payout is '+money(c.min));return}if(amount>effectiveMax){toast('Maximum payout is '+money(effectiveMax));return}return originalRequestPayout.apply(this,arguments)};
 // Feature flags for messaging/wishlist/reviews/coupons etc. Reuse existing systemGuard calls where present.
 window.controlOff=function(k){const legacy=advState();if(legacy&&legacy[k]===true)return true;const c=pc(),f=c.features||{};const map={newSellerRegistration:'sellerRegistration',buyerRegistration:'buyerRegistration',productUploads:'productUpload',productUpload:'productUpload',productApproval:'productApproval',sellerAds:'sellerAds',ads:'sellerAds',withdrawals:'withdrawals',payments:'payments',referrals:'referrals',reviews:'reviews',messaging:'messaging',wishlist:'wishlist',coupons:'coupons',refunds:'refunds',disputes:'disputes',notifications:'notifications',sellerAnalytics:'sellerAnalytics',productAnalytics:'productAnalytics',subscriptions:'subscriptions'};const featureKey=map[k]||k;return Object.prototype.hasOwnProperty.call(f,featureKey)?f[featureKey]===false:false};
 window.systemGuard=function(key,message){if(window.controlOff(key)){toast(message||'This feature is disabled by Admin');return false}return true};
})();
